<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You, The Love of My Life</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    
    <!-- =========================
         CUSTOM CURSOR
    ========================== -->

    <div class="custom-cursor"></div>


    <!-- =========================
         PAGE 1
    ========================== -->

    <main class="page page1">


        <!-- Main frame -->
        <section class="romance-frame">

            <!-- Corner ornaments -->
            <span class="corner top-left">❦</span>
            <span class="corner top-right">❦</span>

            <span class="corner bottom-left">❦</span>
            <span class="corner bottom-right">❦</span>


            <!-- Top ornament -->
            <div class="ornament">

                <span>♡</span>

                <span class="line"></span>

                <span>❦</span>

                <span class="line"></span>

                <span>♡</span>

            </div>


            <!-- =========================
                 MAIN CONTENT
            ========================== -->

            <div class="opening-content">

                <p class="eyebrow">
                    bwat bibip
                </p>


                <h1>
                    FOR YOU
                    <br>
                    <span>THE LOVE OF MY LIFE</span>
                </h1>


                <div class="divider">
                    <span>❦</span>
                </div>


                <p class="dedication">
                    albyn adha syafiq.m
                </p>


                <p class="message">
                    there are a few things
                    <br>
                    I've been meaning to tell you...
                </p>


                <!-- Open button -->
                <button id="openButton" type="button">
                    ♡ &nbsp; OPEN &nbsp; ♡
                </button>

            </div>


            <!-- Bottom decoration -->
            <div class="bottom-text">

                <span>❧</span>

                <p> made w loOve :> </p>

                <span>❧</span>

            </div>

        </section>

    </main>


    <!-- =========================
         AUDIO
    ========================== -->

    <!-- Click sound -->
    <audio id="clickSound" preload="auto">
        <source src="clicksound.mp3" type="audio/mpeg">
    </audio>


    <!-- La Vie En Rose -->
    <audio id="backgroundMusic" loop preload="auto">
        <source src="la-vie-en-rose.mp3" type="audio/mpeg">
    </audio>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
